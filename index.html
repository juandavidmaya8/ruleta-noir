<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruleta Noir</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Ruleta Noir</h1>
    <div class="wallet">
      <div class="balance">
        <small>Saldo disponible</small>
        <strong id="balance">$0</strong>
      </div>
      <button id="btn-deposit" class="btn">Recargar</button>
      <button id="btn-withdraw" class="btn ghost">Retirar</button>
    </div>
  </header>

  <main class="layout">
    <section class="wheel-box">
      <div class="pointer"></div>
      <canvas id="wheel" width="420" height="420"></canvas>
      <p id="result" class="result">Recarga saldo y haz tu apuesta.</p>
      <div id="history" class="history"></div>
    </section>

    <section class="table-box">
      <div class="chips" id="chips"></div>
      <div class="table-scroll"><div id="board" class="board"></div></div>
      <div class="actions">
        <span>Apostado: <b id="total-bet">$0</b></span>
        <button id="btn-clear" class="btn ghost">Limpiar</button>
        <button id="btn-spin" class="btn">Girar</button>
      </div>
    </section>
  </main>

  <dialog id="money-dialog">
    <h2 id="dialog-title">Recargar saldo</h2>
    <label for="amount">Monto en pesos colombianos</label>
    <input id="amount" type="number" min="1" step="1000" placeholder="50000">
    <p id="dialog-error" class="error"></p>
    <div class="dialog-actions">
      <button id="dialog-cancel" class="btn ghost">Cancelar</button>
      <button id="dialog-ok" class="btn">OK</button>
    </div>
  </dialog>

  <script src="game.js"></script>
</body>
</html>
